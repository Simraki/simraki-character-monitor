name: Release Creation

permissions:
  contents: write

on:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Substitute the version (the tag without the `v`) and the versioned URLs in module.json
      - name: Substitute Manifest and Download Links For Versioned Ones
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          jq --indent 4 \
            --arg version "${TAG#v}" \
            --arg url "$REPO_URL" \
            --arg manifest "$REPO_URL/releases/latest/download/module.json" \
            --arg download "$REPO_URL/releases/download/$TAG/module.zip" \
            '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
            module.json > module.json.tmp
          mv module.json.tmp module.json

      # Create a zip file with all files required by the module to add to the release
      - name: Create module.zip
        run: zip -r module.zip module.json README.md LICENSE CHANGELOG.md styles/ scripts/ languages/

      # Attach the files to the published release
      - name: Update Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          name: ${{ github.event.release.name }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: 'module.json,module.zip'
          artifactErrorsFailBuild: true
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
